<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Student Quiz</title>

<style>
body{
    margin:0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:white;
    width:90%;
    max-width:800px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#764ba2;
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0 15px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

.question{
    margin-top:15px;
    padding:10px;
    background:#f3f3f3;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    background:#764ba2;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#5a3c91;
}

.success{
    text-align:center;
    color:green;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">
<h1>🎓 Quiz</h1>

<form id="quizForm">

<label>Name</label>
<input type="text" name="name" required>

<label>PRN</label>
<input type="text" name="prn" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Favourite Coding Language</label>
<select name="language" required>
<option value="">Select</option>
<option>Python</option>
<option>Java</option>
<option>C++</option>
<option>JavaScript</option>
<option>Other</option>
</select>

<div class="question">
<p>1️⃣ What does HTML stand for?</p>
<input type="radio" name="q1" value="Hyper Text Markup Language" required> Hyper Text Markup Language<br>
<input type="radio" name="q1" value="High Tech Modern Language"> High Tech Modern Language<br>
<input type="radio" name="q1" value="Home Tool Markup Language"> Home Tool Markup Language
</div>

<div class="question">
<p>2️⃣ Which is used for styling?</p>
<input type="radio" name="q2" value="CSS" required> CSS<br>
<input type="radio" name="q2" value="HTML"> HTML<br>
<input type="radio" name="q2" value="Python"> Python
</div>

<div class="question">
<p>3️⃣ JavaScript is used for?</p>
<input type="radio" name="q3" value="Frontend" required> Frontend<br>
<input type="radio" name="q3" value="Backend"> Backend<br>
<input type="radio" name="q3" value="Both"> Both
</div>

<button type="submit">Submit Quiz 🚀</button>

<div class="success" id="msg"></div>

</form>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbyC1qlhWviaDBJ7tJxCGxZVKHevVciijuoIrfG1l5v6Mjgz4tAfFC6nYtBNbv26GkoIbA/exec";

document.getElementById("quizForm").addEventListener("submit", function(e){
    e.preventDefault();
    const formData = new FormData(this);

    fetch(scriptURL, { method: 'POST', body: formData})
    .then(response => {
        document.getElementById("msg").innerHTML="✅ Submitted Successfully!";
        document.getElementById("quizForm").reset();
    })
    .catch(error => alert("Error!", error.message));
});
</script>

</body>
</html>
